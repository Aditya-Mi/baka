name: baka
description: A personal journal app with local-only storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.1
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  uuid: ^4.4.2
  package_info_plus: ^8.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700

    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/PlayfairDisplay-SemiBoldItalic.ttf
          weight: 600
          style: italic

    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # Default (Android light mode + iOS light mode): dark-colored icon on light background
  image_path: "assets/icons/baka_icon_dark.png"
  # iOS dark mode: light-colored icon on dark background
  image_path_ios_dark_mode: "assets/icons/baka_icon_light.png"
  # Android adaptive icon: cream background + colored foreground
  # monochrome field is ONLY used for themed icons (Nothing Glyph, Android 13 theming)
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: "assets/icons/baka_icon_dark.png"
  adaptive_icon_monochrome: "assets/icons/baka_icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/icons/baka_icon_dark.png"
    background_color: "#F5F0E8"
    theme_color: "#C4622D"
