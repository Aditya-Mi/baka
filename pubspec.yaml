name: baka
description: A personal journal app with local-only storage.
publish_to: 'none'
version: 1.5.0+1  # build number overridden by CI (github.run_number)

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^14.2.7
  shared_preferences: ^2.3.1
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  uuid: ^4.4.2
  package_info_plus: ^8.1.0
  intl: ^0.19.0
  crypto: ^3.0.3
  archive: ^3.6.1
  image_picker: ^1.1.2
  http: ^1.2.0
  url_launcher: ^6.2.0
  open_file: ^3.3.2
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
        - asset: assets/fonts/Caveat-Bold.ttf
          weight: 700

    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/PlayfairDisplay-SemiBoldItalic.ttf
          weight: 600
          style: italic

    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
        - asset: assets/fonts/CourierPrime-Italic.ttf
          style: italic

    # Fonts below are subset to Latin + Latin-Ext and instanced to static
    # weights — widgets set `fontWeight:` on plain TextStyle, which does not
    # drive the wght axis of a variable font.

    # Field preset — one superfamily across display, body, accent and mono.
    - family: IBMPlexSerif
      fonts:
        - asset: assets/fonts/IBMPlexSerif-Regular.ttf
        - asset: assets/fonts/IBMPlexSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSerif-Italic.ttf
          style: italic

    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          style: italic

    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexMono-Italic.ttf
          style: italic

    # Letter preset — Fraunces cut at opsz 48, SOFT 50, WONK 1. Display only,
    # so it has no italic; headings never render italic.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700

    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
        - asset: assets/fonts/NunitoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-Italic.ttf
          style: italic

    # Warm preset display face — the display sibling of EB Garamond.
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700

    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic

    - family: CrimsonPro
      fonts:
        - asset: assets/fonts/CrimsonPro-Regular.ttf
        - asset: assets/fonts/CrimsonPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/CrimsonPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CrimsonPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/CrimsonPro-Italic.ttf
          style: italic

    # Libre Baskerville ships only 400 and 700 upstream.
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Regular.ttf
        - asset: assets/fonts/LibreBaskerville-Bold.ttf
          weight: 700
        - asset: assets/fonts/LibreBaskerville-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # Default (Android light mode + iOS light mode): dark-colored icon on light background
  image_path: "assets/icons/baka_icon_dark.png"
  # iOS dark mode: light-colored icon on dark background
  image_path_ios_dark_mode: "assets/icons/baka_icon_light.png"
  # Android adaptive icon: cream background + colored foreground
  # monochrome field is ONLY used for themed icons (Nothing Glyph, Android 13 theming)
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: "assets/icons/baka_icon_dark.png"
  adaptive_icon_monochrome: "assets/icons/baka_icon_monochrome.png"
  web:
    generate: true
    image_path: "assets/icons/baka_icon_dark.png"
    background_color: "#F5F0E8"
    theme_color: "#C4622D"
