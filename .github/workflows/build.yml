name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # ── Read version from pubspec.yaml ────────────────────────────────────────
      - name: Read pubspec version
        id: pubspec
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            PUBSPEC=${{ steps.pubspec.outputs.version }}
            if [[ "$TAG" != "$PUBSPEC" ]]; then
              echo "::warning::Tag v$TAG does not match pubspec version $PUBSPEC"
            fi
            echo "name=$PUBSPEC" >> $GITHUB_OUTPUT
          else
            echo "name=0.0.0-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      # ── Decode keystore (release builds only) ────────────────────────────────
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # ── ON TAG: build signed APK + create GitHub Release ─────────────────────
      - name: Build APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Baka ${{ steps.ver.outputs.name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

