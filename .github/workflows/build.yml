name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Read version name from pubspec.yaml (e.g. "1.2.0" from "1.2.0+3")
      - name: Read pubspec version
        id: pubspec
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Resolve version: tag → pubspec version, branch push → "0.0.0+<run>"
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            PUBSPEC=${{ steps.pubspec.outputs.version }}
            # Warn if tag and pubspec mismatch
            if [[ "$TAG" != "$PUBSPEC" ]]; then
              echo "::warning::Tag v$TAG does not match pubspec version $PUBSPEC"
            fi
            echo "name=$PUBSPEC" >> $GITHUB_OUTPUT
            echo "artifact=baka-$PUBSPEC" >> $GITHUB_OUTPUT
          else
            echo "name=0.0.0" >> $GITHUB_OUTPUT
            echo "artifact=baka-dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: |
          flutter build apk --release --no-obfuscate \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Create GitHub Release only on version tags
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Baka ${{ steps.ver.outputs.name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
