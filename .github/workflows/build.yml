name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          flutter-version: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # ── Read version from pubspec.yaml ────────────────────────────────────────
      - name: Read pubspec version
        id: pubspec
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/v}
            PUBSPEC=${{ steps.pubspec.outputs.version }}
            if [[ "$TAG" != "$PUBSPEC" ]]; then
              echo "::warning::Tag v$TAG does not match pubspec version $PUBSPEC"
            fi
            echo "name=$PUBSPEC" >> $GITHUB_OUTPUT
            echo "artifact=baka-$PUBSPEC" >> $GITHUB_OUTPUT
          else
            echo "name=0.0.0" >> $GITHUB_OUTPUT
            echo "artifact=baka-dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      # ── Decode keystore (release builds only, skip fork PRs) ─────────────────
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # ── ON TAG: Shorebird release (builds + signs + uploads to Shorebird) ─────
      # Shorebird produces the APK at build/app/outputs/flutter-apk/app-release.apk
      # No need for a second flutter build apk step.
      - name: Shorebird Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: shorebird release android --artifact apk --build-number=${{ github.run_number }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Baka ${{ steps.ver.outputs.name }}
          files: build/app/outputs/**/*.apk
          generate_release_notes: true

      # ── ON MAIN PUSH: Shorebird patch (OTA, Dart-only changes) ───────────────
      - name: Shorebird Patch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: shorebird patch android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        continue-on-error: true   # fails silently if no release exists yet

